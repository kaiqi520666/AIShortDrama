name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: aisd
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d aisd"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.15"
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run pytest
        env:
          APP_ENV: test
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/aisd
          TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/aisd_test
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: ci-secret

  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: aisd
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d aisd"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.15"
      - run: uv sync --locked
      - run: uv run alembic upgrade head
        env:
          APP_ENV: development
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/aisd
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: ci-secret

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run test -- --run
      - run: npm run build

  contracts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.15"
      - run: uv sync --locked
      - run: uv run python scripts/export_generation_capabilities.py --check
