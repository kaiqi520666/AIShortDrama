<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/src/assets/mooncut-mark.svg" type="image/svg+xml" />
    <title>Mooncut</title>
    <script>
      (() => {
        const stored = localStorage.getItem('mooncut-theme')
        const mode = ['light', 'dark'].includes(stored) ? stored : 'system'
        const isCanvas = /^\/workspaces\/[^/]+\/?$/.test(location.pathname)
        const theme = isCanvas ? mode === 'system' && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : mode === 'system' ? 'light' : mode : 'dark'
        document.documentElement.dataset.theme = theme
        document.documentElement.style.colorScheme = theme
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
